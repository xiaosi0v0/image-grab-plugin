<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电商图片下载插件</title>
    <style>
        body{font-family:Arial;margin:40px;}
        .btn{
            display:inline-block;
            padding:12px 24px;
            background:#28c76f;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }
    </style>

<body>
    <h1>电商图片下载插件</h1>
    <p>支持淘宝、京东、拼多多商品详情页图片批量抓取下载。</p>
    <h3>使用步骤</h3>
    <ol>
        <li>打开Chrome扩展管理页面 chrome://extensions/</li>
